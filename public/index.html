<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status da Live</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #111;
            color: #eee;
        }

        #status {
            font-size: 2rem;
            transition: color 0.3s ease;
        }

        #lastCheck {
            color: #888;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        #conn {
            color: #f5a623;
            font-size: 0.9rem;
            min-height: 1.2rem;
        }
    </style>
</head>

<body>

    <h1 id="status">⏳ Verificando...</h1>
    <p id="lastCheck"></p>
    <p id="conn"></p>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const statusEl = document.getElementById("status");
        const lastCheckEl = document.getElementById("lastCheck");
        const connEl = document.getElementById("conn");

        socket.on("liveStatus", data => {
            statusEl.innerText = data.online ? "🟢 AO VIVO" : "🔴 Offline";

            if (data.lastCheck) {
                const time = new Date(data.lastCheck).toLocaleTimeString("pt-BR");
                lastCheckEl.innerText = `Última verificação: ${time}`;
            }

            connEl.innerText = data.error ? `⚠️ Falha na última verificação: ${data.error}` : "";
        });

        socket.on("connect", () => {
            connEl.innerText = "";
        });

        socket.on("disconnect", () => {
            connEl.innerText = "⚠️ Conexão perdida, tentando reconectar...";
        });

        socket.on("connect_error", () => {
            connEl.innerText = "⚠️ Erro ao conectar ao servidor...";
        });
    </script>

</body>

</html>
